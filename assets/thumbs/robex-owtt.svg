<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'IBM Plex Mono', Consolas, Menlo, monospace">
  <title>Schematic: one-way travel time acoustic navigation under ice</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4fa8d8" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="water"><rect x="0" y="100" width="960" height="440"/></clipPath>
  </defs>
  <rect width="960" height="540" fill="#0f2740"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- ice sheet -->
  <path d="M0 0H960V92L905 108 838 90 772 116 700 98 622 120 548 96 474 114 404 94 330 118 256 98 180 116 108 94 44 110 0 98Z"
        fill="#8fd4f5" fill-opacity=".16" stroke="#8fd4f5" stroke-width="3" stroke-linejoin="round"/>
  <text x="910" y="62" text-anchor="end" font-size="30" letter-spacing="4" fill="#8fd4f5">ICE</text>

  <!-- acoustic wavefronts from the beacon -->
  <g clip-path="url(#water)" fill="none" stroke="#4fa8d8" stroke-width="3" stroke-dasharray="10 10">
    <circle cx="220" cy="222" r="110" stroke-opacity=".8"/>
    <circle cx="220" cy="222" r="200" stroke-opacity=".55"/>
    <circle cx="220" cy="222" r="290" stroke-opacity=".35"/>
    <circle cx="220" cy="222" r="380" stroke-opacity=".2"/>
  </g>

  <!-- beacon hung through the ice -->
  <line x1="220" y1="104" x2="220" y2="190" stroke="#8fd4f5" stroke-width="3"/>
  <rect x="198" y="190" width="44" height="64" rx="6" fill="#0b1e33" stroke="#ff8a3d" stroke-width="4"/>
  <circle cx="220" cy="222" r="8" fill="#ff8a3d"/>

  <!-- range -->
  <line x1="220" y1="222" x2="622" y2="391" stroke="#ff8a3d" stroke-width="4" stroke-dasharray="14 10"/>
  <g transform="translate(400 282) rotate(22.8)">
    <rect x="-8" y="-34" width="182" height="46" fill="#0f2740"/>
    <text font-size="36" fill="#ff8a3d">r = c·Δt</text>
  </g>

  <!-- AUV -->
  <g transform="translate(560 360)">
    <path d="M236 4 L272 -26 H286 L268 10Z" fill="#8fd4f5"/>
    <path d="M236 58 L272 88 H286 L268 52Z" fill="#8fd4f5"/>
    <rect width="270" height="62" rx="31" fill="#0b1e33" stroke="#8fd4f5" stroke-width="5"/>
    <line x1="296" y1="12" x2="296" y2="50" stroke="#8fd4f5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="62" cy="31" r="10" fill="#ff8a3d"/>
  </g>

  <!-- labels -->
  <rect x="34" y="262" width="150" height="40" fill="#0f2740"/>
  <text x="40" y="292" font-size="28" fill="#eaf2f8">CSAC TX</text>
  <text x="560" y="486" font-size="28" fill="#eaf2f8">AUV · CSAC RX</text>
  <text x="40" y="516" font-size="22" letter-spacing="3" fill="#7f9db3">ONE-WAY TRAVEL TIME · SCHEMATIC</text>
</svg>
